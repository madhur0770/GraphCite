# GraphCite with Neo4j (and optionally Ollama).
#
#   cp .env.example .env     # then set NEO4J_PASSWORD (at least 8 characters)
#   docker compose up --build                       # app + Neo4j; use Ollama running on your host
#   docker compose --profile ollama up --build      # also start an Ollama container
#
# Open http://localhost:8501 and choose "Live (Neo4j + Ollama)".
services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env (at least 8 characters)}
    ports:
      - "127.0.0.1:7474:7474"   # Neo4j Browser
      - "127.0.0.1:7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/7687' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12

  app:
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      GRAPHCITE_MODEL: ${GRAPHCITE_MODEL:-llama3.2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      neo4j:
        condition: service_healthy

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  neo4j_data:
  ollama_data:
